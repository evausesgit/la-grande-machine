# Déployé par Coolify — définir dans l'interface :
#   DB_PASSWORD      (mot de passe PostgreSQL)
#   ADMIN_TOKEN      (jeton des routes POST /api/collecte, /api/brief, /api/brief/generer)
#   CODEX_AUTH_PATH  (chemin, sur l'hôte Coolify, du auth.json codex d'Eva — copié
#                     depuis ~/.codex/auth.json en local ; rédaction du brief du matin.
#                     Le token se rafraîchit tout seul tant qu'il sert régulièrement,
#                     mais une session ChatGPT révoquée oblige à recopier le fichier)
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://machine:${DB_PASSWORD}@db:5432/machine
      RUN_SCHEDULER: "1"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ${CODEX_AUTH_PATH}:/srv/.codex/auth.json:ro
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: machine
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: machine
    volumes:
      # « machine-db » (sans suffixe) abandonné le 2026-07-07 : initialisé avec
      # un autre mot de passe lors d'un premier déploiement raté.
      - machine-db-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  machine-db-v2:
